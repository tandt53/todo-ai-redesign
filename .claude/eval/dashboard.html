<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Pipeline Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 28px; margin-bottom: 4px; color: #f8fafc; }
  .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; margin-bottom: 28px; }
  .card { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; }
  .card-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .card-value { font-size: 28px; font-weight: 700; color: #f8fafc; }
  .card-value.green { color: #4ade80; }
  .card-value.yellow { color: #fbbf24; }
  .card-value.red { color: #f87171; }
  .card-value.blue { color: #60a5fa; }
  h2 { font-size: 18px; margin-bottom: 14px; color: #f8fafc; }
  .section { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 10px; color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid #334155; }
  td { padding: 8px 10px; border-bottom: 1px solid #1e293b; font-size: 13px; vertical-align: top; }
  tr:hover td { background: #162032; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .b-done { background: #065f46; color: #6ee7b7; }
  .b-blocked { background: #7c2d12; color: #fdba74; }
  .b-unknown { background: #334155; color: #94a3b8; }
  .b-agent { background: #1e3a5f; color: #7dd3fc; }
  .b-feature { background: #3b1f6e; color: #c4b5fd; }
  .bar-row { display: flex; align-items: center; margin-bottom: 8px; }
  .bar-name { width: 120px; font-size: 13px; color: #cbd5e1; }
  .bar-track { flex: 1; height: 24px; background: #0f172a; border-radius: 4px; overflow: hidden; margin: 0 10px; }
  .bar-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 600; color: #fff; }
  .files-list { font-size: 12px; color: #94a3b8; max-height: 80px; overflow-y: auto; }
  .files-list div { padding: 1px 0; font-family: 'SF Mono', monospace; }
  .summary-text { font-size: 13px; color: #cbd5e1; line-height: 1.5; }
  .blocker-text { font-size: 12px; color: #fbbf24; }
  .qs-sub { font-size:12px; font-weight:400; color:#94a3b8; margin-left:8px; }
.qs-empty { color:#94a3b8; font-size:13px; padding:12px 0; }
.qs-feature { border:1px solid #334155; border-radius:8px; padding:14px 16px; margin-bottom:10px; background:#0f172a; }
.qs-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.qs-fid { font-weight:700; color:#e2e8f0; font-size:15px; }
.qs-verdict { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.03em; }
.qs-pass { background:#064e3b; color:#6ee7b7; }
.qs-fail { background:#7f1d1d; color:#fca5a5; }
.qs-warn { background:#78350f; color:#fcd34d; }
.qs-row { display:flex; gap:22px; flex-wrap:wrap; font-size:13px; color:#cbd5e1; }
.qs-k { color:#94a3b8; margin-right:5px; }
.qs-chk { display:inline-block; font-family:ui-monospace,monospace; font-size:11px; background:#7f1d1d; color:#fca5a5; padding:2px 6px; border-radius:4px; margin-right:4px; }
.qs-bug { display:inline-block; font-size:11px; padding:2px 7px; border-radius:4px; margin-right:4px; background:#1e293b; color:#cbd5e1; border:1px solid #334155; }
.acs { font-size: 12px; color: #a78bfa; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col, .three-col { grid-template-columns: 1fr; } }
  .test-bar { display: flex; height: 20px; border-radius: 4px; overflow: hidden; }
  .test-pass { background: #22c55e; }
  .test-fail { background: #ef4444; }
  .test-label { font-size: 11px; color: #94a3b8; margin-top: 4px; }
  .agent-detail { background: #0f172a; border-radius: 8px; padding: 14px; margin-bottom: 12px; border-left: 3px solid #3b82f6; }
  .agent-detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .agent-detail h3 { font-size: 14px; color: #f8fafc; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .detail-item { font-size: 12px; }
  .detail-label { color: #64748b; }
  .detail-value { color: #e2e8f0; }
  .timestamp { font-size: 11px; color: #64748b; }
  /* Live monitoring */
  .live-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .live-btn:hover { border-color: #64748b; }
  .live-btn.live-on { background: #065f46; border-color: #059669; color: #6ee7b7; }
  /* Table controls */
  .table-controls { display: flex; gap: 12px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .search-box { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; color: #e2e8f0; font-size: 13px; width: 260px; outline: none; }
  .search-box:focus { border-color: #3b82f6; }
  .search-box::placeholder { color: #64748b; }
  .filter-group { display: flex; gap: 8px; }
  .filter-select { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 10px; color: #e2e8f0; font-size: 12px; outline: none; cursor: pointer; }
  .filter-select:focus { border-color: #3b82f6; }
  /* Sortable headers */
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: #e2e8f0; }
  .sort-icon { font-size: 10px; margin-left: 2px; color: #64748b; }
  th.sort-asc .sort-icon::after { content: ' ▲'; }
  th.sort-desc .sort-icon::after { content: ' ▼'; }
  /* Table footer */
  .table-footer { padding: 10px 0; font-size: 12px; color: #64748b; }
  /* Clickable rows */
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #1e293b; }
  tr.clickable td:first-child::before { content: '▶ '; font-size: 10px; color: #64748b; }
  tr.clickable.open td:first-child::before { content: '▼ '; }
  tr.detail-row { display: none; }
  tr.detail-row.open { display: table-row; }
  tr.detail-row td { padding: 0; border-bottom: 2px solid #334155; }
  .detail-panel { background: #0f172a; padding: 16px 20px; }
  .detail-panel h4 { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 6px 0; }
  .detail-panel h4:first-child { margin-top: 0; }
  .detail-panel .summary-block { background: #1e293b; border-radius: 8px; padding: 16px 20px; font-size: 13px; color: #cbd5e1; line-height: 1.7; margin-bottom: 8px; }
  .detail-panel .summary-block h1, .detail-panel .summary-block h2, .detail-panel .summary-block h3 { color: #f8fafc; margin: 14px 0 6px 0; font-size: 15px; }
  .detail-panel .summary-block h2 { font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid #334155; padding-bottom: 4px; }
  .detail-panel .summary-block ul, .detail-panel .summary-block ol { padding-left: 20px; margin: 6px 0; }
  .detail-panel .summary-block li { margin-bottom: 3px; }
  .detail-panel .summary-block code { background: #334155; padding: 1px 5px; border-radius: 3px; font-size: 12px; color: #7dd3fc; font-family: 'SF Mono', monospace; }
  .detail-panel .summary-block strong { color: #f8fafc; }
  .detail-panel .summary-block p { margin: 6px 0; }
  .detail-panel .summary-block .check-pass { color: #4ade80; }
  .detail-panel .summary-block .check-fail { color: #f87171; }
  .detail-panel .file-tree { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: #7dd3fc; line-height: 1.7; }
  .detail-panel .file-tree .dir { color: #94a3b8; }
  .detail-panel .blocker-block { background: #2d1a0e; border: 1px solid #7c2d12; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #fdba74; }
  .detail-panel .ac-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .detail-panel .ac-badge { background: #3b1f6e; color: #c4b5fd; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .detail-panel .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .detail-panel .meta-item { font-size: 12px; }
  .detail-panel .meta-item .label { color: #64748b; }
  .detail-panel .meta-item .value { color: #e2e8f0; font-weight: 500; }
  .detail-panel .test-summary { display: flex; align-items: center; gap: 12px; }
  .detail-panel .test-bar-wide { flex: 1; height: 16px; border-radius: 4px; overflow: hidden; display: flex; max-width: 200px; }
  .detail-panel .raw-json { background: #1e293b; border-radius: 8px; padding: 12px; font-family: 'SF Mono', monospace; font-size: 11px; color: #94a3b8; max-height: 200px; overflow-y: auto; white-space: pre-wrap; display: none; }
  .detail-panel .toggle-raw { background: none; border: 1px solid #334155; color: #64748b; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-top: 8px; }
  .detail-panel .toggle-raw:hover { border-color: #64748b; color: #94a3b8; }
  /* Pipeline visualization */
  .pipeline-section { display: flex; gap: 20px; margin-bottom: 20px; }
  .pipeline-flow { flex: 1; background: #1e293b; border-radius: 12px; padding: 24px 28px; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; }
  .pipeline-tasks { width: 360px; min-width: 360px; background: #1e293b; border-radius: 12px; padding: 16px 18px; border: 1px solid #334155; max-height: 320px; overflow-y: auto; }
  /* Mermaid overrides */
  #pipeline-mermaid { width: 100%; }
  #pipeline-mermaid svg { width: 100% !important; height: auto !important; max-height: 300px; }
  #pipeline-mermaid .subgraph-label { fill: #64748b !important; font-size: 11px !important; }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(96,165,250,0.2)); }
    50% { filter: drop-shadow(0 0 16px rgba(96,165,250,0.6)); }
  }
  /* Task sidebar */
  .pipeline-tasks h3 { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; font-weight: 600; }
  .task-item { padding: 8px 12px; border-radius: 8px; margin-bottom: 4px; font-size: 12px; border-left: 3px solid #334155; display: flex; gap: 8px; align-items: baseline; }
  .task-item.done { border-left-color: #10b981; color: #94a3b8; }
  .task-item.active { border-left-color: #60a5fa; background: linear-gradient(90deg, rgba(30,58,95,0.5), transparent); color: #e2e8f0; animation: glow 2s ease-in-out infinite; }
  .task-item.pending { border-left-color: #475569; color: #64748b; border-left-style: dashed; }
  .task-item .task-id { font-weight: 700; min-width: 38px; font-size: 11px; }
  .task-item .task-agent { font-size: 10px; color: #64748b; min-width: 80px; }
  .task-item .task-title { font-size: 12px; flex: 1; }
  .task-item.done .task-id::before { content: '✓ '; color: #10b981; }
  .task-item.active .task-id::before { content: '● '; color: #60a5fa; }
  .task-item.pending .task-id::before { content: '○ '; color: #475569; }
  .task-section-label { font-size: 10px; color: #475569; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin: 12px 0 6px 0; }
  .task-section-label:first-child { margin-top: 0; }
  .current-task { background: linear-gradient(90deg, rgba(30,58,95,0.4), transparent); border: 1px solid #3b82f6; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .current-task .task-label { font-size: 11px; color: #60a5fa; font-weight: 600; }
  .current-task .task-desc { font-size: 13px; color: #e2e8f0; margin-top: 2px; }
  .blocker-item { padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; font-size: 11px; border-left: 3px solid #f59e0b; color: #fbbf24; }
  .blocker-item .blocker-id { font-weight: 700; }
  .no-items { font-size: 12px; color: #475569; font-style: italic; }
  @media (max-width: 1100px) { .pipeline-section { flex-direction: column; } .pipeline-tasks { width: 100%; min-width: auto; max-height: none; } }
</style>
</head>
<body>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
  <h1>Agent Pipeline Dashboard</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="live-indicator" style="display:none;color:#4ade80;font-size:12px">updated</span>
    <button id="live-btn" onclick="toggleLive()" class="live-btn">Live: OFF</button>
  </div>
</div>
<p class="subtitle" id="project-info"></p>

<div class="pipeline-section">
  <div class="pipeline-flow">
    <div id="pipeline-mermaid"></div>
  </div>
  <div class="pipeline-tasks">
    <h3>Tasks</h3>
    <div id="task-sidebar"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({
    startOnLoad: false,
    theme: 'dark',
    themeVariables: {
      darkMode: true,
      background: '#1e293b',
      primaryColor: '#1e293b',
      primaryTextColor: '#e2e8f0',
      lineColor: '#475569',
      fontSize: '16px',
    },
    flowchart: { curve: 'basis', padding: 20, nodeSpacing: 30, rankSpacing: 40 },
  });
</script>

<div class="grid" id="summary-cards"></div>

<div class="section" id="quality-section">
  <h2>Quality Signals <span class="qs-sub">Layer 2 — judged by other agents, not self-reported</span></h2>
  <div id="quality-signals"></div>
</div>

<div class="two-col">
  <div class="section">
    <h2>Dispatches by Agent</h2>
    <div id="agent-bars"></div>
  </div>
  <div class="section">
    <h2>Project Growth</h2>
    <div id="project-stats"></div>
  </div>
</div>

<div class="section">
  <h2>All Dispatches</h2>
  <div class="table-controls">
    <input type="text" id="search-input" placeholder="Search dispatches..." class="search-box">
    <div class="filter-group">
      <select id="filter-agent" class="filter-select"><option value="">All Agents</option></select>
      <select id="filter-status" class="filter-select"><option value="">All Statuses</option></select>
      <select id="filter-feature" class="filter-select"><option value="">All Features</option></select>
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th class="sortable" data-col="timestamp">Time <span class="sort-icon"></span></th>
        <th class="sortable" data-col="agent">Agent <span class="sort-icon"></span></th>
        <th class="sortable" data-col="task_id">Task <span class="sort-icon"></span></th>
        <th class="sortable" data-col="feature_id">Feature <span class="sort-icon"></span></th>
        <th class="sortable" data-col="status">Status <span class="sort-icon"></span></th>
        <th class="sortable" data-col="files">Files <span class="sort-icon"></span></th>
        <th class="sortable" data-col="tests">Tests <span class="sort-icon"></span></th>
        <th>ACs</th>
        <th>Summary</th>
      </tr>
    </thead>
    <tbody id="dispatch-table"></tbody>
  </table>
  <div class="table-footer" id="table-footer"></div>
</div>

<script>
// Simple markdown to HTML converter
function md(text) {
  if (!text || text === 'No summary available' || text === 'No summary extracted') return '';
  return text
    // Headers
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // Bold
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Checkmarks
    .replace(/✅/g, '<span class="check-pass">&#10003;</span>')
    .replace(/❌/g, '<span class="check-fail">&#10007;</span>')
    // Unordered lists
    .replace(/^[\-\*] (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, (m) => '<ul>' + m + '</ul>')
    // Line breaks (double newline = paragraph, single = br)
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>')
    // Wrap in paragraph
    .replace(/^/, '<p>').replace(/$/, '</p>')
    // Clean up empty paragraphs
    .replace(/<p>\s*<\/p>/g, '')
    .replace(/<p><h/g, '<h').replace(/<\/h([123])><\/p>/g, '</h$1>')
    .replace(/<p><ul>/g, '<ul>').replace(/<\/ul><\/p>/g, '</ul>');
}

// Strip markdown to plain text for table previews
function plainText(text) {
  if (!text || text === 'No summary available' || text === 'No summary extracted') return '';
  return text
    .replace(/^#{1,3}\s+.+$/gm, '')        // remove headings
    .replace(/\*\*(.+?)\*\*/g, '$1')        // bold → plain
    .replace(/`([^`]+)`/g, '$1')            // code → plain
    .replace(/^[\-\*]\s+/gm, '')            // remove list markers
    .replace(/✅|❌/g, '')                   // remove checkmarks
    .replace(/\n+/g, ' ')                   // newlines → space
    .replace(/\s+/g, ' ')                   // collapse whitespace
    .trim();
}

let metrics = [];
let qualitySignals = [];
let sorted = [];
let latest = null;

let tasksData = null;
let statusData = null;
let briefingData = null;
let blockersData = [];

function renderQualitySignals() {
  const el = document.getElementById('quality-signals');
  if (!el) return;
  if (!qualitySignals.length) {
    el.innerHTML = '<div class="qs-empty">No Layer-2 signals yet. These appear once reviewer-agent, ' +
      'product-agent, or a QA agent writes a report, a bug, or a test run — the hook captures them automatically.</div>';
    return;
  }

  // Group by feature: one card per feature, every independent judgement on it.
  const byFeature = {};
  for (const sig of qualitySignals) {
    const f = sig.feature || 'unknown';
    (byFeature[f] = byFeature[f] || []).push(sig);
  }

  el.innerHTML = Object.keys(byFeature).sort().reverse().map(fid => {
    const sigs = byFeature[fid];
    const review = sigs.find(x => x.signal_type === 'review');
    const product = sigs.find(x => x.signal_type === 'product_review');
    const bugs = sigs.filter(x => x.signal_type === 'bug');
    const runs = sigs.filter(x => x.signal_type === 'test_run');

    let verdict = '<span class="qs-verdict qs-warn">NO REVIEW</span>';
    if (review) {
      const failed = Number(review.checks_failed || 0);
      verdict = failed > 0
        ? '<span class="qs-verdict qs-fail">' + esc(review.result || 'STRUCTURAL-FAIL') + '</span>'
        : '<span class="qs-verdict qs-pass">' + esc(review.result || 'STRUCTURAL-PASS') + '</span>';
    }

    const parts = [];
    if (review) {
      const chks = String(review.failed_checks || '').split(',').filter(Boolean)
        .map(c => '<span class="qs-chk">' + esc(c.trim()) + '</span>').join('');
      parts.push('<div><span class="qs-k">checks</span>' +
        esc(review.checks_passed || 0) + ' passed / ' + esc(review.checks_failed || 0) + ' failed ' +
        (chks ? ' ' + chks : '') + '</div>');
    }
    if (product) {
      parts.push('<div><span class="qs-k">product</span>' + esc(product.result || '—') + '</div>');
    }
    if (bugs.length) {
      // NB: the envelope's `layer` field means "metrics layer 2" — the bug's own
      // stack layer is `root_cause_layer` (api/web/mobile), per capture-quality-signals.sh.
      const chips = bugs.map(b => {
        const sev = b.severity && b.severity !== 'unknown' ? b.severity : 'bug';
        const rcl = b.root_cause_layer && b.root_cause_layer !== 'unknown' ? ' · ' + b.root_cause_layer : '';
        return '<span class="qs-bug">' + esc(b.bug_id || '') + ' ' + esc(sev) + esc(rcl) + '</span>';
      }).join('');
      parts.push('<div><span class="qs-k">bugs</span>' + chips + '</div>');
    }
    if (runs.length) {
      const pass = runs.reduce((n, r) => n + Number(r.tests_passed || 0), 0);
      const fail = runs.reduce((n, r) => n + Number(r.tests_failed || 0), 0);
      parts.push('<div><span class="qs-k">test runs</span>' + pass + ' passed / ' + fail + ' failed</div>');
    }

    return '<div class="qs-feature">' +
      '<div class="qs-head"><span class="qs-fid">' + esc(fid) + '</span>' + verdict + '</div>' +
      '<div class="qs-row">' + (parts.join('') || '<div class="qs-empty">signal recorded, no detail parsed</div>') + '</div>' +
      '</div>';
  }).join('');
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}


// Static builds inject real arrays here; the live server leaves them empty and
// the fetches below fill them in. Keep both names in sync with generate-dashboard.sh.
const INLINE_LAYER1 = /*__INJECT_LAYER1__*/[];
const INLINE_LAYER2 = /*__INJECT_LAYER2__*/[];

async function loadAndRender() {
  if (INLINE_LAYER1.length || INLINE_LAYER2.length) {
    // Static report opened over file:// — no server to fetch from.
    metrics = INLINE_LAYER1;
    qualitySignals = INLINE_LAYER2;
  } else {
    const [metricsRes, l2Res, tasksRes, statusRes, briefingRes, blockersRes] = await Promise.all([
      fetch('/api/metrics/layer1').catch(() => null),
      fetch('/api/metrics/layer2').catch(() => null),
      fetch('/api/tasks').catch(() => null),
      fetch('/api/status').catch(() => null),
      fetch('/api/briefing').catch(() => null),
      fetch('/api/blockers').catch(() => null),
    ]);
    try {
      if (metricsRes) metrics = await metricsRes.json();
      if (l2Res) qualitySignals = await l2Res.json();
      if (tasksRes) tasksData = await tasksRes.json();
      if (statusRes) statusData = await statusRes.json();
      if (briefingRes) briefingData = await briefingRes.json();
      if (blockersRes) blockersData = await blockersRes.json();
    } catch {}
  }

  if (!metrics.length && !qualitySignals.length) {
    document.body.innerHTML = '<h1 style="color:#f87171;padding:40px">Cannot load metrics.<br>' +
      'Static report: rebuild with <code style="color:#60a5fa">bash .claude/eval/generate-dashboard.sh</code><br>' +
      'Live view: start the server with <code style="color:#60a5fa">node .claude/eval/server.cjs</code></h1>';
    return;
  }

  if (!metrics.length) {
    // Layer-2 signals exist without Layer-1 dispatches — unusual but renderable.
    document.getElementById('summary-cards').innerHTML =
      '<div class="card"><div class="card-label">Layer 1</div><div class="card-value">no dispatches captured</div></div>';
    renderQualitySignals();
    return;
  }

  sorted = [...metrics].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  latest = sorted[sorted.length - 1];
  renderDashboard();
}

async function renderDashboard() {

// --- Render Mermaid Pipeline from pipeline.mmd ---
const activeAgents = new Set((statusData?.in_flight || []).map(a => a.agent));

const container = document.getElementById('pipeline-mermaid');
container.innerHTML = '';
try {
  const pipelineRes = await fetch('/api/pipeline');
  let mermaidDef = await pipelineRes.text();

  // Append style classes
  mermaidDef += `\n  classDef default fill:#065f46,stroke:#10b981,color:#6ee7b7,stroke-width:2px,font-weight:bold\n`;
  mermaidDef += `  classDef active fill:#1e3a5f,stroke:#60a5fa,color:#93c5fd,stroke-width:3px,font-weight:bold\n`;

  // Apply active class to in-flight agents
  activeAgents.forEach(a => {
    const id = a.replace(/-/g, '_');
    mermaidDef += `  class ${id} active\n`;
  });

  const svgId = 'pipeline-svg-' + Date.now();
  const { svg } = await mermaid.render(svgId, mermaidDef);
  container.innerHTML = svg;

  // Add glow animation to active nodes
  container.querySelectorAll('[class*="active"] rect, [class*="active"] polygon').forEach(el => {
    el.style.animation = 'glow 2s ease-in-out infinite';
  });
} catch (e) {
  container.innerHTML = '<p style="color:#f87171">Pipeline diagram error: ' + e.message + '</p>';
}

// --- Task Sidebar ---
let sidebarHTML = '';

// Previous (last 5 done tasks, newest first)
const doneTasks = (tasksData?.done || []).slice(-5).reverse();
sidebarHTML += '<div class="task-section-label">Previous</div>';
if (doneTasks.length) {
  sidebarHTML += doneTasks.map(t =>
    `<div class="task-item done">
      <span class="task-id">${t.id}</span>
      <span class="task-agent">${t.agent}</span>
      <span class="task-title">${t.title}</span>
    </div>`
  ).join('');
} else {
  sidebarHTML += '<p class="no-items">No completed tasks</p>';
}

// Current (from BRIEFING.md)
sidebarHTML += '<div class="task-section-label">Current</div>';
if (briefingData && briefingData.task) {
  sidebarHTML += `<div class="current-task">
    <div class="task-label">${briefingData.agent || 'agent'}</div>
    <div class="task-desc">${briefingData.task}</div>
  </div>`;
} else {
  sidebarHTML += '<p class="no-items">No active task</p>';
}

// Blockers
if (blockersData && blockersData.length) {
  sidebarHTML += '<div class="task-section-label">Blockers</div>';
  sidebarHTML += blockersData.map(b =>
    `<div class="blocker-item">
      <span class="blocker-id">${b.id}</span> ${b.description}
    </div>`
  ).join('');
}

// Next (pending tasks)
const pendingTasks = (tasksData?.pending || []).slice(0, 5);
sidebarHTML += '<div class="task-section-label">Next</div>';
if (pendingTasks.length) {
  sidebarHTML += pendingTasks.map(t =>
    `<div class="task-item pending">
      <span class="task-id">${t.id}</span>
      <span class="task-agent">${t.agent}</span>
      <span class="task-title">${t.title}</span>
    </div>`
  ).join('');
} else {
  sidebarHTML += '<p class="no-items">No pending tasks</p>';
}

document.getElementById('task-sidebar').innerHTML = sidebarHTML;

// Project info
document.getElementById('project-info').textContent =
  `${latest?.project || 'Project'} — Last updated: ${new Date(latest?.timestamp).toLocaleString()} — ${metrics.length} total dispatches`;

// Summary cards
const totalDispatches = metrics.length;
const uniqueAgents = [...new Set(metrics.map(m => m.agent))].length;
const doneCount = metrics.filter(m => m.status && m.status.trim() === 'DONE').length;
const blockedCount = metrics.filter(m => m.status === 'BLOCKED').length;
const totalFiles = latest?.project_stats?.source_files || metrics.reduce((sum, m) => sum + (m.files_created_count || 0), 0);
const totalLOC = latest?.project_stats?.total_loc || 0;
const totalTests = latest?.project_stats?.test_files || 0;
const totalSpecs = latest?.project_stats?.spec_files || 0;

document.getElementById('summary-cards').innerHTML = [
  { label: 'Dispatches', value: totalDispatches, cls: '' },
  { label: 'Agents Used', value: uniqueAgents, cls: 'blue' },
  { label: 'Completed', value: doneCount, cls: 'green' },
  { label: 'Blocked', value: blockedCount, cls: 'yellow' },
  { label: 'Source Files', value: totalFiles, cls: '' },
  { label: 'Test Files', value: totalTests, cls: '' },
  { label: 'Spec Files', value: totalSpecs, cls: '' },
  { label: 'Lines of Code', value: totalLOC.toLocaleString(), cls: 'blue' },
].map(c => `
  <div class="card">
    <div class="card-label">${c.label}</div>
    <div class="card-value ${c.cls}">${c.value}</div>
  </div>
`).join('');

// Agent bars
const agentCounts = {};
const agentColors = {
  'spec-agent': '#8b5cf6', 'architect-agent': '#6366f1', 'design-agent': '#ec4899',
  'backend-agent': '#3b82f6', 'web-agent': '#06b6d4', 'mobile-agent': '#14b8a6',
  'qa-api-agent': '#f59e0b', 'qa-web-agent': '#f97316', 'qa-mobile-agent': '#ef4444',
  'reviewer-agent': '#10b981', 'product-agent': '#a855f7', 'general-purpose': '#64748b'
};
metrics.forEach(m => { agentCounts[m.agent] = (agentCounts[m.agent] || 0) + 1; });
const maxCount = Math.max(...Object.values(agentCounts));
document.getElementById('agent-bars').innerHTML = Object.entries(agentCounts)
  .sort((a, b) => b[1] - a[1])
  .map(([agent, count]) => `
    <div class="bar-row">
      <div class="bar-name">${agent}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width: ${(count/maxCount)*100}%; background: ${agentColors[agent] || '#3b82f6'}">
          ${count}
        </div>
      </div>
    </div>
  `).join('');

// Project stats (from latest metric that has them)
const statsMetrics = sorted.filter(m => m.project_stats);
if (statsMetrics.length > 0) {
  const latestStats = statsMetrics[statsMetrics.length - 1].project_stats;
  document.getElementById('project-stats').innerHTML = [
    { label: 'Spec Files', value: latestStats.spec_files, color: '#8b5cf6' },
    { label: 'Source Files', value: latestStats.source_files, color: '#3b82f6' },
    { label: 'Test Files', value: latestStats.test_files, color: '#06b6d4' },
    { label: 'QA Files', value: latestStats.qa_files, color: '#f59e0b' },
    { label: 'Total LOC', value: latestStats.total_loc, color: '#10b981' },
  ].map(s => `
    <div class="bar-row">
      <div class="bar-name">${s.label}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width: ${Math.min((s.value / Math.max(latestStats.total_loc, 1)) * 100, 100)}%; min-width: ${s.value > 0 ? '30px' : '0'}; background: ${s.color}">
          ${s.value}
        </div>
      </div>
    </div>
  `).join('');
} else {
  document.getElementById('project-stats').innerHTML = '<p style="color:#64748b">No project stats captured yet. Stats are recorded from the next dispatch onward.</p>';
}

// --- Populate filter dropdowns ---
const agents = [...new Set(metrics.map(m => m.agent))].sort();
const statuses = [...new Set(metrics.map(m => (m.status || 'unknown').trim()))].sort();
const features = [...new Set(metrics.map(m => m.feature_id).filter(f => f && f !== 'unknown'))].sort();

const agentSelect = document.getElementById('filter-agent');
agents.forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a; agentSelect.appendChild(o); });
const statusSelect = document.getElementById('filter-status');
statuses.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; statusSelect.appendChild(o); });
const featureSelect = document.getElementById('filter-feature');
features.forEach(f => { const o = document.createElement('option'); o.value = f; o.textContent = f; featureSelect.appendChild(o); });

// --- Sort state ---
let sortCol = 'timestamp';
let sortDir = 'desc';

// --- Render table ---
function renderTable() {
  const searchTerm = document.getElementById('search-input').value.toLowerCase();
  const filterAgent = agentSelect.value;
  const filterStatus = statusSelect.value;
  const filterFeature = featureSelect.value;

  // Filter
  let filtered = metrics.filter(m => {
    if (filterAgent && m.agent !== filterAgent) return false;
    if (filterStatus && (m.status || 'unknown').trim() !== filterStatus) return false;
    if (filterFeature && m.feature_id !== filterFeature) return false;
    if (searchTerm) {
      const text = JSON.stringify(m).toLowerCase();
      if (!text.includes(searchTerm)) return false;
    }
    return true;
  });

  // Sort
  filtered.sort((a, b) => {
    let va, vb;
    switch (sortCol) {
      case 'timestamp': va = a.timestamp || ''; vb = b.timestamp || ''; break;
      case 'agent': va = a.agent || ''; vb = b.agent || ''; break;
      case 'task_id': va = a.task_id || ''; vb = b.task_id || ''; break;
      case 'feature_id': va = a.feature_id || ''; vb = b.feature_id || ''; break;
      case 'status': va = (a.status || '').trim(); vb = (b.status || '').trim(); break;
      case 'files': va = a.files_created_count || 0; vb = b.files_created_count || 0; break;
      case 'tests': va = (a.tests || {}).total || 0; vb = (b.tests || {}).total || 0; break;
      default: va = a.timestamp || ''; vb = b.timestamp || '';
    }
    if (typeof va === 'number') return sortDir === 'asc' ? va - vb : vb - va;
    return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
  });

  // Update sort icons
  document.querySelectorAll('th.sortable').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.col === sortCol) th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
  });

  // Render rows
  document.getElementById('dispatch-table').innerHTML = filtered.map((m, i) => {
  const status = (m.status || 'unknown').trim();
  const statusCls = status === 'DONE' ? 'b-done' : status === 'BLOCKED' ? 'b-blocked' : 'b-unknown';
  const files = m.files_created || [];
  const tests = m.tests || {};
  const hasTests = tests.passing > 0 || tests.total > 0;
  const testPct = tests.total > 0 ? Math.round((tests.passing / tests.total) * 100) : 0;
  const acs = (m.acs_covered && m.acs_covered !== 'none') ? m.acs_covered.split(',') : [];
  const hasSummary = m.summary && m.summary !== 'No summary extracted';
  const hasBlockers = m.blockers && m.blockers !== 'none';
  const hasFiles = files.length > 0;
  const hasAcs = acs.length > 0;

  // Group files by directory
  const filesByDir = {};
  files.forEach(f => {
    const parts = f.split('/');
    const dir = parts.slice(0, -1).join('/');
    if (!filesByDir[dir]) filesByDir[dir] = [];
    filesByDir[dir].push(parts[parts.length - 1]);
  });

  const summaryRow = `
    <tr class="clickable" onclick="toggleDetail(${i})">
      <td class="timestamp">${new Date(m.timestamp).toLocaleString()}</td>
      <td><span class="badge b-agent">${m.agent}</span></td>
      <td>${m.task_id}</td>
      <td>${m.feature_id && m.feature_id !== 'unknown' ? `<span class="badge b-feature">${m.feature_id}</span>` : '—'}</td>
      <td><span class="badge ${statusCls}">${status}</span></td>
      <td>${m.files_created_count || files.length || 0}</td>
      <td>${hasTests ? `${tests.passing}/${tests.total}` : '—'}</td>
      <td class="acs">${hasAcs ? `${acs.length} ACs` : '—'}</td>
      <td style="max-width:300px;font-size:12px;color:#94a3b8">${hasSummary ? plainText(m.summary).substring(0,120) + (plainText(m.summary).length > 120 ? '...' : '') : '—'}</td>
    </tr>`;

  const detailRow = `
    <tr class="detail-row" id="detail-${i}">
      <td colspan="9">
        <div class="detail-panel">
          <div class="meta-grid">
            <div class="meta-item"><span class="label">Agent: </span><span class="value">${m.agent}</span></div>
            <div class="meta-item"><span class="label">Task: </span><span class="value">${m.task_id} — ${m.task_description || ''}</span></div>
            <div class="meta-item"><span class="label">Feature: </span><span class="value">${m.feature_id || '—'}</span></div>
            <div class="meta-item"><span class="label">Status: </span><span class="badge ${statusCls}">${status}</span></div>
            <div class="meta-item"><span class="label">Timestamp: </span><span class="value">${new Date(m.timestamp).toLocaleString()}</span></div>
            <div class="meta-item"><span class="label">Project: </span><span class="value">${m.project || '—'}</span></div>
          </div>

          ${hasSummary ? `
            <h4>Agent Output</h4>
            <div class="summary-block">${md(m.summary)}</div>
          ` : ''}

          ${hasFiles ? `
            <h4>Files Created (${files.length})</h4>
            <div class="file-tree">
              ${Object.entries(filesByDir).map(([dir, fnames]) =>
                `<div class="dir">${dir}/</div>` +
                fnames.map(f => `<div>&nbsp;&nbsp;${f}</div>`).join('')
              ).join('')}
            </div>
          ` : ''}

          ${hasTests ? `
            <h4>Tests</h4>
            <div class="test-summary">
              <span>${tests.passing} passing / ${tests.total} total (${testPct}%)</span>
              <div class="test-bar-wide">
                <div class="test-pass" style="width:${testPct}%"></div>
                <div class="test-fail" style="width:${100-testPct}%"></div>
              </div>
            </div>
          ` : ''}

          ${hasAcs ? `
            <h4>Acceptance Criteria Covered</h4>
            <div class="ac-list">
              ${acs.map(ac => `<span class="ac-badge">${ac.trim()}</span>`).join('')}
            </div>
          ` : ''}

          ${hasBlockers ? `
            <h4>Blockers</h4>
            <div class="blocker-block">${m.blockers}</div>
          ` : ''}

          ${m.project_stats ? `
            <h4>Project Snapshot (at dispatch time)</h4>
            <div class="meta-grid">
              <div class="meta-item"><span class="label">Spec files: </span><span class="value">${m.project_stats.spec_files}</span></div>
              <div class="meta-item"><span class="label">Source files: </span><span class="value">${m.project_stats.source_files}</span></div>
              <div class="meta-item"><span class="label">Test files: </span><span class="value">${m.project_stats.test_files}</span></div>
              <div class="meta-item"><span class="label">QA files: </span><span class="value">${m.project_stats.qa_files}</span></div>
              <div class="meta-item"><span class="label">Total LOC: </span><span class="value">${m.project_stats.total_loc?.toLocaleString()}</span></div>
            </div>
          ` : ''}

          <button class="toggle-raw" onclick="event.stopPropagation(); toggleRaw(${i})">Show raw JSON</button>
          <pre class="raw-json" id="raw-${i}">${JSON.stringify(m, null, 2)}</pre>
        </div>
      </td>
    </tr>`;

  return summaryRow + detailRow;
}).join('');

  // Footer
  document.getElementById('table-footer').textContent =
    `Showing ${filtered.length} of ${metrics.length} dispatches`;
}

// Initial render
renderQualitySignals();
renderTable();

// Event listeners
document.getElementById('search-input').addEventListener('input', renderTable);
agentSelect.addEventListener('change', renderTable);
statusSelect.addEventListener('change', renderTable);
featureSelect.addEventListener('change', renderTable);

document.querySelectorAll('th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortCol = col;
      sortDir = 'asc';
    }
    renderTable();
  });
});

} // end renderDashboard

function toggleDetail(i) {
  const row = document.getElementById('detail-' + i);
  const clickable = row.previousElementSibling;
  row.classList.toggle('open');
  clickable.classList.toggle('open');
}

function toggleRaw(i) {
  const pre = document.getElementById('raw-' + i);
  const btn = pre.previousElementSibling;
  if (pre.style.display === 'block') {
    pre.style.display = 'none';
    btn.textContent = 'Show raw JSON';
  } else {
    pre.style.display = 'block';
    btn.textContent = 'Hide raw JSON';
  }
}

// Auto-load on page open
loadAndRender();

// --- Live monitoring ---
let autoRefresh = null;
let lastCount = 0;
let lastSignalCount = 0;
let lastStatus = '';

function toggleLive() {
  const btn = document.getElementById('live-btn');
  if (autoRefresh) {
    clearInterval(autoRefresh);
    autoRefresh = null;
    btn.textContent = 'Live: OFF';
    btn.classList.remove('live-on');
  } else {
    autoRefresh = setInterval(async () => {
      try {
        const [metricsRes, l2Res, tasksRes, statusRes, briefingRes, blockersRes] = await Promise.all([
          fetch('/api/metrics/layer1').catch(() => null),
          fetch('/api/metrics/layer2').catch(() => null),
          fetch('/api/tasks').catch(() => null),
          fetch('/api/status').catch(() => null),
          fetch('/api/briefing').catch(() => null),
          fetch('/api/blockers').catch(() => null),
        ]);
        const newMetrics = metricsRes ? await metricsRes.json() : metrics;
        const newSignals = l2Res ? await l2Res.json() : qualitySignals;
        if (tasksRes) tasksData = await tasksRes.json();
        if (statusRes) statusData = await statusRes.json();
        if (briefingRes) briefingData = await briefingRes.json();
        if (blockersRes) blockersData = await blockersRes.json();
        const changed = newMetrics.length !== lastCount
          || newSignals.length !== lastSignalCount
          || JSON.stringify(statusData) !== lastStatus;
        if (changed) {
          lastCount = newMetrics.length;
          lastSignalCount = newSignals.length;
          lastStatus = JSON.stringify(statusData);
          metrics = newMetrics;
          qualitySignals = newSignals;
          sorted = [...metrics].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
          latest = sorted[sorted.length - 1];
          renderDashboard();
          document.getElementById('live-indicator').style.display = 'inline';
          setTimeout(() => document.getElementById('live-indicator').style.display = 'none', 2000);
        }
      } catch {}
    }, 5000);
    lastCount = metrics.length;
    lastSignalCount = qualitySignals.length;
    btn.textContent = 'Live: ON';
    btn.classList.add('live-on');
  }
}
</script>
</body>
</html>
